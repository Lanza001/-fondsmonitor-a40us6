name: NAV aktualisieren

on:
  workflow_dispatch:
  schedule:
    # Werktags zweimal; GitHub verwendet UTC.
    - cron: "15 8 * * 1-5"
    - cron: "15 18 * * 1-5"

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: NAV und Historie aktualisieren
        run: python scripts/update_nav.py

      - name: Änderungen speichern
        run: |
          if git diff --quiet data/nav.json; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "fondsmonitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nav.json
          git commit -m "NAV automatisch aktualisiert"
          git push
