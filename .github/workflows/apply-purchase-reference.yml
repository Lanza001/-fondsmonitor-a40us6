name: Kaufdaten-Patch anwenden

on:
  push:
    branches:
      - feature/purchase-reference
    paths:
      - .github/workflows/apply-purchase-reference.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: feature/purchase-reference

      - name: Kaufdaten in index.html ergänzen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          def replace_once(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"Erwartet genau 1 Treffer, gefunden: {count}: {old[:80]!r}")
              s = s.replace(old, new, 1)

          replace_once(
              '<div class="d"><span>Stückzahl</span><b>390,2153</b></div>\n<div class="d"><span>Aufgelegt</span><b>27.01.2025</b></div>\n<div class="d"><span>NAV-Berechnung</span><b>Täglich*</b></div>\n<div class="d"><span>Datenquelle</span><b id="source">–</b></div>',
              '<div class="d"><span>Stückzahl</span><b>390,2153</b></div>\n<div class="d"><span>Kaufdatum</span><b>12.03.2025</b></div>\n<div class="d"><span>Kaufbetrag</span><b>40.000,00 €</b></div>\n<div class="d"><span>Aufgelegt</span><b>27.01.2025</b></div>\n<div class="d"><span>NAV-Berechnung</span><b>Täglich*</b></div>\n<div class="d"><span>Datenquelle</span><b id="source">–</b></div>'
          )

          replace_once(
              'const UNITS=390.2153;\nconst PERIOD_LABELS={day:"1T",week:"1W",month:"1M","3months":"3M","6months":"6M","1year":"1J",max:"MAX"};',
              'const UNITS=390.2153;\nconst PURCHASE_DATE="2025-03-12";\nconst PURCHASE_AMOUNT=40000;\nconst PERIOD_LABELS={day:"1T",week:"1W",month:"1M","3months":"3M","6months":"6M","1year":"1J",max:"MAX"};'
          )

          replace_once(
              ' if(period==="day")return d.slice(-2);\n if(period==="max")return d;',
              ' if(period==="day")return d.slice(-2);\n if(period==="max")return d.filter(x=>x.date>=PURCHASE_DATE);'
          )

          replace_once(
              ' $("#price").textContent=fmtNum(last.close);\n $("#priceDate").textContent=fmtDate(last.date);\n $("#nominal").textContent=fmtNum(last.close*UNITS);\n\n const s=selected();',
              ' $("#price").textContent=fmtNum(last.close);\n $("#priceDate").textContent=fmtDate(last.date);\n const currentValue=last.close*UNITS;\n $("#nominal").textContent=fmtNum(currentValue);\n const purchaseDiff=currentValue-PURCHASE_AMOUNT;\n const purchasePct=purchaseDiff/PURCHASE_AMOUNT*100;\n const purchaseChange=$("#nominalChange");\n purchaseChange.innerHTML=`${purchaseDiff>=0?"+":""}${fmtEUR(purchaseDiff)} · ${fmtPct(purchasePct)} <span class="change-period">· seit Kauf</span>`;\n purchaseChange.className="change "+(purchaseDiff>0?"up":purchaseDiff<0?"down":"");\n\n const s=selected();'
          )

          replace_once(
              '\n   const nominalDiff=diff*UNITS;\n   const n=$("#nominalChange");n.innerHTML=changeMarkup(nominalDiff,pct);\n   n.className="change "+(nominalDiff>0?"up":nominalDiff<0?"down":"");\n }else{\n   $("#change").textContent="–";$("#change").className="change";\n   $("#nominalChange").textContent="–";$("#nominalChange").className="change";\n }',
              '\n }else{\n   $("#change").textContent="–";$("#change").className="change";\n }'
          )

          replace_once(
              ' let lo=Math.min(...values),hi=Math.max(...values);\n if(hi-lo<10){lo-=5;hi+=5}',
              ' let lo=Math.min(...values,PURCHASE_AMOUNT),hi=Math.max(...values,PURCHASE_AMOUNT);\n if(hi-lo<10){lo-=5;hi+=5}'
          )

          replace_once(
              ' x.setLineDash([]);\n\n const tickCount=Math.min(7,data.length);\n for(let t=0;t<tickCount;t++){\n   const idx=Math.round(t*(data.length-1)/Math.max(1,tickCount-1)),gx=X(idx);\n   x.strokeStyle="rgba(255,255,255,.06)";x.beginPath();x.moveTo(gx,pad.t);x.lineTo(gx,h-pad.b);x.stroke();\n }\n\n const isUp=values.at(-1)>=values[0];',
              ' x.setLineDash([]);\n\n const tickCount=Math.min(7,data.length);\n for(let t=0;t<tickCount;t++){\n   const idx=Math.round(t*(data.length-1)/Math.max(1,tickCount-1)),gx=X(idx);\n   x.strokeStyle="rgba(255,255,255,.06)";x.beginPath();x.moveTo(gx,pad.t);x.lineTo(gx,h-pad.b);x.stroke();\n }\n\n const purchaseY=Y(PURCHASE_AMOUNT);\n x.save();\n x.strokeStyle="rgba(242,198,109,.58)";x.setLineDash([6,5]);x.lineWidth=1.2;\n x.beginPath();x.moveTo(pad.l,purchaseY);x.lineTo(w-pad.r,purchaseY);x.stroke();\n x.setLineDash([]);x.fillStyle="#f2c66d";x.font="11px -apple-system,system-ui";x.textAlign="left";x.textBaseline="bottom";\n x.fillText("Kaufwert 40.000 €",pad.l+6,purchaseY-4);\n x.restore();\n\n const isUp=values.at(-1)>=values[0];'
          )

          p.write_text(s, encoding="utf-8")
          PY

      - name: JavaScript prüfen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          js = s.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/fondsmonitor-app.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/fondsmonitor-app.js

      - name: Diff prüfen und committen
        shell: bash
        run: |
          git diff -- index.html
          git config user.name "fondsmonitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- index.html
          git rm -- .github/workflows/apply-purchase-reference.yml
          git diff --cached --check
          git commit -m "Kaufdaten und Kaufwert ergänzen"
          git push
