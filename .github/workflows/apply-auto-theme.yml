name: Auto-Theme-Patch anwenden

on:
  push:
    branches:
      - feature/automatic-light-mode
    paths:
      - .github/workflows/apply-auto-theme.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: feature/automatic-light-mode

      - name: Automatisches Hell-Dunkel-Layout ergänzen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          def replace_once(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"Erwartet genau 1 Treffer, gefunden: {count}: {old[:120]!r}")
              s = s.replace(old, new, 1)

          replace_once(
              '<meta name="theme-color" content="#0b1220">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">',
              '<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">\n<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" id="iosStatusBarStyle" content="default">\n<script>document.getElementById("iosStatusBarStyle").content=matchMedia("(prefers-color-scheme: dark)").matches?"black-translucent":"default";</script>'
          )

          replace_once(
              ':root{color-scheme:dark;--bg:#07101d;--panel:#102037;--text:#f5f7fb;--muted:#99a7bc;--line:rgba(255,255,255,.10);--up:#65d49a;--down:#ff7d88;--warn:#f2c66d;--accent:#77a7ff}',
              ':root{color-scheme:light dark;--bg:#07101d;--panel:#102037;--text:#f5f7fb;--muted:#99a7bc;--line:rgba(255,255,255,.10);--up:#65d49a;--down:#ff7d88;--warn:#f2c66d;--accent:#77a7ff;--brand:#EC0000;--chart-grid:rgba(255,255,255,.10);--chart-grid-soft:rgba(255,255,255,.06);--chart-axis:#93a1b5;--chart-line:#9db9d1;--chart-border:rgba(255,255,255,.14);--chart-empty:#8794a7;--chart-purchase:#f2c66d;--chart-purchase-line:rgba(242,198,109,.58);--area-up:rgba(101,212,154,.10);--area-down:rgba(255,125,136,.10)}'
          )

          replace_once(
              '.eyebrow{font-size:12px;color:#9fc4ff;font-weight:700;letter-spacing:.02em;margin-top:7px;margin-left:38px}',
              '.eyebrow{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.02em;margin-top:7px;margin-left:38px}'
          )

          light_css = '''
@media(prefers-color-scheme:light){
:root{--bg:#f6f7f9;--panel:#ffffff;--text:#171a21;--muted:#667085;--line:rgba(17,24,39,.10);--up:#16855b;--down:#d92d20;--warn:#b54708;--accent:#EC0000;--chart-grid:rgba(17,24,39,.10);--chart-grid-soft:rgba(17,24,39,.055);--chart-axis:#667085;--chart-line:#EC0000;--chart-border:rgba(17,24,39,.14);--chart-empty:#98a2b3;--chart-purchase:#b54708;--chart-purchase-line:rgba(181,71,8,.55);--area-up:rgba(22,133,91,.10);--area-down:rgba(217,45,32,.09)}
html,body{background:radial-gradient(circle at 70% -10%,rgba(236,0,0,.07),transparent 38%),linear-gradient(180deg,#fbfbfc 0%,#f4f5f7 55%,#eef0f3 100%)}
.icon-btn{background:rgba(255,255,255,.86);color:#252b33;border-color:rgba(17,24,39,.10);box-shadow:0 6px 18px rgba(17,24,39,.06)}
.card{background:linear-gradient(145deg,rgba(255,255,255,.99),rgba(248,249,251,.98));border-color:rgba(17,24,39,.09);box-shadow:0 18px 50px rgba(17,24,39,.09)}
.currency{color:#667085}
.change{background:rgba(17,24,39,.045)}
.change.up{color:var(--up);background:rgba(22,133,91,.09)}
.change.down{color:var(--down);background:rgba(217,45,32,.08)}
.meta{border-top-color:rgba(17,24,39,.08)}
.chart-title,.chart-subtitle{color:#252b33}
.period{border-color:rgba(17,24,39,.12);background:rgba(17,24,39,.025);color:#667085}
.period.active{background:#EC0000;color:#fff;border-color:#EC0000;box-shadow:0 5px 14px rgba(236,0,0,.18)}
.message{border-color:rgba(236,0,0,.14);background:rgba(236,0,0,.055);color:#7a1a1a}
.message.error{border-color:rgba(217,45,32,.18);background:rgba(217,45,32,.08);color:#b42318}
.chart-section+.chart-section{border-top-color:rgba(17,24,39,.08)}
.chart-hover-line{background:rgba(17,24,39,.20)}
.chart-hover-dot{background:#EC0000;border-color:#fff;box-shadow:0 0 0 2px rgba(236,0,0,.12)}
.chart-tooltip{background:rgba(255,255,255,.97);border-color:rgba(17,24,39,.12);box-shadow:0 10px 30px rgba(17,24,39,.14);color:#475467}
.chart-tooltip b{color:#171a21}
.stat{background:rgba(17,24,39,.025);border-color:rgba(17,24,39,.07)}
.note{background:rgba(236,0,0,.045);border-color:rgba(236,0,0,.11);color:#6f2930}
.footer{color:#7a8492}
}
'''
          replace_once(
              '@media(max-width:430px){',
              light_css + '@media(max-width:430px){'
          )

          replace_once(
              'const fmtPct=v=>(v>0?"+":"")+v.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";',
              'const fmtPct=v=>(v>0?"+":"")+v.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";\nconst cssVar=name=>getComputedStyle(document.documentElement).getPropertyValue(name).trim();\nconst schemeQuery=window.matchMedia("(prefers-color-scheme: dark)");'
          )

          s = s.replace('g.addColorStop(1,"rgba(101,212,154,0)");', 'g.addColorStop(1,"rgba(0,0,0,0)");')
          if s.count('x.fillStyle="#8794a7"') != 2:
              raise SystemExit('Unerwartete Anzahl für chart-empty')
          s = s.replace('x.fillStyle="#8794a7"', 'x.fillStyle=cssVar("--chart-empty")')
          if s.count('x.strokeStyle="rgba(255,255,255,.10)";x.setLineDash([4,4]);x.lineWidth=1;x.fillStyle="#93a1b5"') != 2:
              raise SystemExit('Unerwartete Anzahl für Chart-Raster/Achse')
          s = s.replace('x.strokeStyle="rgba(255,255,255,.10)";x.setLineDash([4,4]);x.lineWidth=1;x.fillStyle="#93a1b5"', 'x.strokeStyle=cssVar("--chart-grid");x.setLineDash([4,4]);x.lineWidth=1;x.fillStyle=cssVar("--chart-axis")')
          if s.count('x.strokeStyle="rgba(255,255,255,.06)"') != 2:
              raise SystemExit('Unerwartete Anzahl für vertikales Raster')
          s = s.replace('x.strokeStyle="rgba(255,255,255,.06)"', 'x.strokeStyle=cssVar("--chart-grid-soft")')
          if s.count('isUp?"rgba(101,212,154,.10)":"rgba(255,125,136,.10)"') != 2:
              raise SystemExit('Unerwartete Anzahl für Flächenfarben')
          s = s.replace('isUp?"rgba(101,212,154,.10)":"rgba(255,125,136,.10)"', 'cssVar(isUp?"--area-up":"--area-down")')
          if s.count('x.strokeStyle="#9db9d1"') != 2 or s.count('x.fillStyle="#9db9d1"') != 2:
              raise SystemExit('Unerwartete Anzahl für Chart-Linie/Punkt')
          s = s.replace('x.strokeStyle="#9db9d1"', 'x.strokeStyle=cssVar("--chart-line")')
          s = s.replace('x.fillStyle="#9db9d1"', 'x.fillStyle=cssVar("--chart-line")')
          if s.count('x.fillStyle="#93a1b5"') != 2:
              raise SystemExit('Unerwartete Anzahl für Achsenbeschriftung')
          s = s.replace('x.fillStyle="#93a1b5"', 'x.fillStyle=cssVar("--chart-axis")')
          if s.count('x.strokeStyle="rgba(255,255,255,.14)"') != 2:
              raise SystemExit('Unerwartete Anzahl für Chart-Basislinie')
          s = s.replace('x.strokeStyle="rgba(255,255,255,.14)"', 'x.strokeStyle=cssVar("--chart-border")')
          replace_once('x.strokeStyle="rgba(242,198,109,.58)";x.setLineDash([6,5]);x.lineWidth=1.2;', 'x.strokeStyle=cssVar("--chart-purchase-line");x.setLineDash([6,5]);x.lineWidth=1.2;')
          replace_once('x.setLineDash([]);x.fillStyle="#f2c66d";x.font="11px -apple-system,system-ui";x.textAlign="left";x.textBaseline="bottom";', 'x.setLineDash([]);x.fillStyle=cssVar("--chart-purchase");x.font="11px -apple-system,system-ui";x.textAlign="left";x.textBaseline="bottom";')

          replace_once(
              'window.addEventListener("resize",()=>allData.length&&render());\nload();',
              'window.addEventListener("resize",()=>allData.length&&render());\nconst onSchemeChange=()=>allData.length&&render();\nif(schemeQuery.addEventListener)schemeQuery.addEventListener("change",onSchemeChange);\nelse if(schemeQuery.addListener)schemeQuery.addListener(onSchemeChange);\nload();'
          )

          p.write_text(s, encoding="utf-8")
          PY

      - name: JavaScript prüfen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          scripts = s.split("<script>")[1:]
          js = "\n".join(x.split("</script>", 1)[0] for x in scripts)
          Path("/tmp/fondsmonitor-app.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/fondsmonitor-app.js

      - name: Diff prüfen und committen
        shell: bash
        run: |
          git diff -- index.html
          git config user.name "fondsmonitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- index.html
          git rm -- .github/workflows/apply-auto-theme.yml
          git diff --cached --check
          git commit -m "Automatisches Hell-Dunkel-Layout ergänzen"
          git push
